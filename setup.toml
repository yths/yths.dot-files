# Everything you would change to make this desktop yours.
#
# The installer, the bootstrap script and the dependency documentation all read this file, so
# a change here reaches every one of them. Nothing else needs editing to adopt this
# repository on a new machine: pick a theme, adjust the package list, and run
# `./bootstrap.sh`.
#
# Read with tomllib, which is in the standard library — this adds no dependency.

[desktop]
# Which bundled theme to install without prompting. `install.py --theme <name>` overrides it,
# and an empty string restores the interactive prompt. Run `python helper/list_themes.py` to
# see what is available.
theme = "default"

# The font is the theme's. Each bundle's config.json names the family the whole desktop
# derives from -- the bar, the terminal, the launcher, the boot splash -- and every other size
# is computed from its size. ./bootstrap.sh installs the package that provides it
# (helper/fonts.py knows which package provides which family). This is what the desktop uses
# instead when that install fails, or the family is not on the machine when install.py runs.
# It is always installed, so it is there before it is needed, and it must be a Nerd Font --
# the bar draws glyphs from the private use area.
fallback_font_family = "Iosevka NF"
fallback_font_package = "ttf-iosevka-nerd"

[state]
# How the desktop starts, and what `install.py` resets it to. `theme_mode = "automatic"` lets
# the location widget flip light and dark at sunrise and sunset; "manual" leaves it to you.
theme = "light"
condition = "normal"
theme_mode = "automatic"
audio_mode = "automatic"

[credentials]
# Secrets the installer offers to collect into ~/.config/credentials.json, mode 0600. It only
# ever asks; declining is fine and the desktop runs without them. IPINFO_TOKEN buys the
# location widget its sunrise and sunset times, and with them the automatic theme switch.
prompt = ["IPINFO_TOKEN"]

[packages]
# Installed by ./bootstrap.sh with `yay -S`. Grouped by what stops working without them, so
# a group you do not want can be deleted whole.

# The desktop itself. Without these there is nothing to log into.
core = [
    "xorg-server", "xorg-xinit", "xinit-xsession",
    "qtile", "python-dbus-fast",
    "kitty", "rofi", "dunst", "picom",
    # Where GTK keeps the preferences that are not files -- the file chooser showing
    # hidden entries, and the light/dark scheme GTK 4 follows. helper/patch_gtk.py
    # writes them through gsettings, which needs this backend to make them persist.
    "dconf",
    # The screen lock, and the daemon that fires it on idle, on suspend, and when systemd
    # asks for a session lock. xsecurelock fails closed: if it cannot grab the screen it
    # refuses to exit, rather than leaving an unlocked desktop behind.
    "xsecurelock", "xss-lock",
    # Without this, xss-lock locks the screen during a film. Browsers and video players ask
    # for a D-Bus screensaver inhibit; logind, which xss-lock obeys, never hears about it.
    # inhibit-bridge is what carries the one to the other. qtile starts it -- it docks in the
    # bar's system tray, which does not exist until qtile has drawn the bar.
    "inhibit-bridge-git",
    # The password dialog polkit shows when a program asks to do something privileged --
    # mounting a disk, pkexec, a GUI settings tool. Without an agent nothing can ask, and
    # pkexec falls back to a terminal prompt that polkit 127 rejects whatever is typed.
    "polkit-gnome",
    # The Secret Service: an encrypted store for tokens and passwords, unlocked by the login
    # password through the pam_gnome_keyring lines Arch's /etc/pam.d/lightdm already
    # carries. Without it, VSCode and other Electron apps keep their secrets under a key
    # built into Electron, which anything running as this user can decrypt.
    "gnome-keyring", "libsecret",
    # The everyday keys. maim captures and xclip copies the screenshot keys' images;
    # playerctl drives whichever media player is active; brightnessctl the backlight, where
    # there is one. notify-send (libnotify) announces where a screenshot was saved.
    "maim", "xclip", "playerctl", "brightnessctl", "libnotify",
]

# The login screen and the boot splash. The greeter itself, nody-greeter, is not here: its
# AUR package no longer builds, so ./bootstrap.sh makes it from packages/nody-greeter/ once
# these are in place. Anything under packages/ is installed that way and belongs in no group.
boot = ["lightdm", "plymouth"]

# The metrics service the bar reads from, and its pacman hook.
backend = ["valkey", "python-redis", "pacman-contrib"]

# Imported by the helper scripts. helper/list_dependencies.py checks this list against what
# the code actually imports, and the pre-commit gate fails if they disagree.
# python-colour-science is under packages/, not here: see there.
python = [
    "python-numpy", "python-screeninfo", "python-loguru", "python-toml",
    "python-pillow", "python-pycairo", "python-websockets",
    "python-sounddevice",
]

# Everything still works without these; each one buys a specific thing.
optional = [
    "displaycal",   # display colour calibration; without it, screens run uncalibrated
    "mpv",          # video playback, bound to `,m` in qutebrowser
    "qutebrowser",  # the browser the palette is mapped for
    "tmux",
    "starship",
    "vim",
]

# Needed only to change this repository, not to run it. ./bootstrap.sh --dev installs them.
development = [
    "ruff",
    "python-pytest",
    # tests/test_lock_pam.py exercises the lock screen's PAM stack by compiling a small client
    # against libpam and running it in a sandbox with a fake /etc/pam.d -- which is how the
    # success path gets checked without a real password, and without touching the stack the
    # rest of the system logs in through. Both are also what `makepkg` needs to build
    # configuration/lock/pam/. Absent, that one test skips rather than fails.
    "base-devel",
    "bubblewrap",
]
